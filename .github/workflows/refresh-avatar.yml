name: Refresh GitHub avatar

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

concurrency:
  group: profile-avatar
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Render the current profile owner's avatar
        env:
          PROFILE_OWNER: ${{ github.repository_owner }}
        run: python scripts/build_profile.py --refresh-avatar --username "$PROFILE_OWNER"
      - name: Save only changed avatar assets
        run: |
          git add assets/avatar.png assets/hero-light.svg assets/hero-dark.svg
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: refresh GitHub avatar'
          git push
